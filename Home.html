<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KosmicMisfits</title>

    <link rel="stylesheet" href="style.css">
    <script src="scripts.js" defer></script>
</head>

<body>

<header class="siteheader">
    <section class="left-header">
        <a class="logo" href="Home.html" aria-label="KosmicMisfits home">
            Kosmic Logo
        </a>
        <h1>KosmicMisfits</h1>
    </section>

    <section class="right-header">
        <section class="mintNav">
            <button class="mintButton" id="mintPanel" type="button">
                <span>Mint</span>
            </button>
        </section>

        <section class="menu">
            <button
                class="Menu"
                id="bars"
                type="button"
                onclick="toggleMenu()"
                aria-label="Toggle navigation menu"
                aria-controls="menuPanel"
                aria-expanded="false">

                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </section>
    </section>
</header>

<section class="menupanel" id="menuPanel" aria-label="Main navigation">
   <button
    class="Menu active menu-close"
    id="closeMenu"
    type="button"
    onclick="toggleMenu()"
    aria-label="Close navigation menu">

    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
</button>
    <h1>This is where the menu list goes</h1>

    <div class="menu-options">

        <button
            class="nav"
            id="loreButton"
            type="button"
            onclick="infoDisplay()"
            aria-controls="loreInfo"
            aria-expanded="false">

            <span class="plus" aria-hidden="true"></span>
            <span class="plus" aria-hidden="true"></span>
            <h2 class="menuItems">LORE</h2>
        </button>

        <button class="nav" id="aboutButton" type="button">
            <span class="plus" aria-hidden="true"></span>
            <span class="plus" aria-hidden="true"></span>
            <h2 class="menuItems">ABOUT</h2>
        </button>

        <button class="nav" id="contactButton" type="button">
            <span class="plus" aria-hidden="true"></span>
            <span class="plus" aria-hidden="true"></span>
            <h2 class="menuItems">CONTACT</h2>
        </button>

    </div>
</section>

<section
    class="loreInfo"
    id="loreInfo"
    aria-label="Project lore"
    aria-hidden="true">
    <button
            class="nav"
            id="loreButton"
            type="button"
            onclick="infoDisplay()"
            aria-controls="loreInfo"
            aria-expanded="false">

            <span class="plus" aria-hidden="true"></span>
            <span class="plus" aria-hidden="true"></span>
            <h2 class="menuItems">LORE</h2>
        </button>
    <h1>This is where the project lore goes into</h1>
</section>

</body>
</html>
